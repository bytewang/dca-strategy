name: 月度定投提醒

on:
  # 每月19、20、21号 9:00（北京时间）运行
  schedule:
    - cron: '0 1 19 * *'
    - cron: '0 1 20 * *'
    - cron: '0 1 21 * *'
  # 也支持手动触发，方便测试
  workflow_dispatch:

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 运行定投策略
        env:
          WECOM_KEY: ${{ secrets.WECOM_KEY }}
        run: |
          python dca_bot.py
